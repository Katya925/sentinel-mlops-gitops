name: Sentinel MLOps - Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas automatizadas
    runs-on: ubuntu-latest

    env:
      OTEL_SDK_DISABLED: "true"
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validar sintaxis Python
        run: |
          python -m compileall -q backend tests mlops


      - name: Validar datos de entrada
        run: |
          python -m mlops.validate_data

      - name: Validar modelo Random Forest
        run: |
          python -m mlops.validate_model

      - name: Generar manifiesto de version del modelo
        run: |
          python -m mlops.version_model

      # Comprobar que el archivo se genero
      - name: Verificar manifiesto generado
        run: |
          echo "Directorio actual:"
          pwd
          echo "Contenido de mlops/artifacts:"
          ls -la mlops/artifacts/
          test -f mlops/artifacts/model_manifest.json

      - name: Publicar manifiesto como artefacto de CI
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-model-manifest
          path: mlops/artifacts/model_manifest.json
          if-no-files-found: error
          retention-days: 30


      - name: Ejecutar Pytest
        run: |
          python -m pytest -q tests

  docker-build:
    name: Construccion Docker
    runs-on: ubuntu-latest
    needs: tests

    permissions:
      contents: read
      packages: write

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar en GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar nombre de imagen
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER}/sentinel-backend" >> "$GITHUB_OUTPUT"

      - name: Construir imagen con cache y publicar en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=sentinel-backend
          cache-to: type=gha,mode=max,scope=sentinel-backend

      - name: Construir imagen sin publicar
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha,scope=sentinel-backend

  deploy-lab:
    name: Despliegue y Smoke Tests
    runs-on: ubuntu-latest
    needs: docker-build

    # Solo desplegar imagenes publicadas desde main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: read

    env:
      SENTINEL_IMAGE: ghcr.io/${{ github.repository_owner }}/sentinel-backend:${{ github.sha }}

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Autenticar en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalizar nombre de imagen
        run: |
          echo "SENTINEL_IMAGE=$(echo "$SENTINEL_IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Validar configuracion de despliegue
        run: |
          docker compose -f compose.release.yaml config --quiet

      - name: Descargar imagen versionada
        run: |
          docker compose -f compose.release.yaml pull backend

      - name: Desplegar version desde GHCR
        run: |
          docker compose -f compose.release.yaml up -d --no-build --wait --wait-timeout 120

      - name: Verificar imagen desplegada
        run: |
          docker compose -f compose.release.yaml ps
          docker image inspect "$SENTINEL_IMAGE" --format '{{.Id}}'

      - name: Ejecutar Smoke Tests
        env:
          SENTINEL_API_URL: http://127.0.0.1:8000
        run: |
          python mlops/smoke_test.py

      - name: Guardar diagnostico del despliegue
        if: always()
        run: |
          mkdir -p deployment-evidence
          echo "Commit: $GITHUB_SHA" > deployment-evidence/release.txt
          echo "Imagen: $SENTINEL_IMAGE" >> deployment-evidence/release.txt
          docker compose -f compose.release.yaml ps -a > deployment-evidence/containers.txt 2>&1 || true
          docker compose -f compose.release.yaml logs --no-color backend > deployment-evidence/backend.log 2>&1 || true

      - name: Publicar evidencias de despliegue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-release-evidence
          path: deployment-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Limpiar entorno de laboratorio
        if: always()
        run: |
          docker compose -f compose.release.yaml down
